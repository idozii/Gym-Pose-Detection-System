[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-pose-detection"
version = "0.1.0"
description = "Experimental source-label pose research toolkit (not safety or clinical form coaching)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "pandas>=2,<3", "scikit-learn>=1.3,<2", "joblib>=1.3"]

[project.optional-dependencies]
camera = ["mediapipe==0.10.14", "opencv-python>=4.8,<5"]
dev = ["pytest>=8", "PyYAML>=6,<7"]
hfmodels = ["huggingface-hub>=0.27,<2"]
webapi = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
gym-pose = "gym_pose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
