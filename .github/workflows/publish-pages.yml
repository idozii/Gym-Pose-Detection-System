name: Publish Free Push-up Pose Preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --prefix web --no-audit --no-fund

      - name: Frontend unit tests
        run: npm test --prefix web

      - name: Compile with project-relative public base path
        run: npm run build --prefix web -- --base /Gym-Pose-Detection-System/
        env:
          VITE_INFERENCE_API_URL: ''

      - name: Verify static frontend artifact
        run: |
          test -f web/dist/index.html
          test -d web/dist/assets

      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only public static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
